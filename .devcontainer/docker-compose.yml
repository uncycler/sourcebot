version: '3.8'

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile.noci
    volumes:
      - ..:/workspaces/sourcebot:cached
      - go-modules:/home/node/go
      - yarn-cache:/home/node/.yarn/berry/cache
    command: sleep infinity
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379
      ZOEKT_WEBSERVER_URL: http://localhost:6070
      CTAGS_COMMAND: ctags
      AUTH_SECRET: "00000000000000000000000000000000000000000000"
      AUTH_URL: http://localhost:3000
      DATA_CACHE_DIR: /workspaces/sourcebot/.sourcebot
      SOURCEBOT_ENCRYPTION_KEY: "00000000000000000000000000000000"
      NODE_ENV: development
      SOURCEBOT_LOG_LEVEL: debug
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  go-modules:
  yarn-cache:
  postgres-data:
  redis-data:
